<div *ngIf="course" class="courseItems">
  <ul>Course ID: {{ course.id }}</ul>
  <ul>Course Name: {{ course.name }}</ul>
  <ul>Course Description: {{ course.description }}</ul>
  <ul>Course Floor Number: {{ course.floorNumber}}</ul>
  <ul>Course Room Number: {{ course.roomNumber }}</ul>
</div>
<div id="back_button">
  <a [routerLink]="['']">Go back</a>
</div>
<div>
  <p *ngIf="error" class="error">{{error}} </p>
</div>
